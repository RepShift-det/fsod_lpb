MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: logs/hrrsd_hrsid/stage2/7499-rsnew
  MASK_ON: False
  BACKBONE:
    NAME: "build_vgg_backbone"
  ROI_HEADS:
    IN_FEATURES: ["vgg4"]
    NAME: "StandardROIHeads"
    NUM_CLASSES: 1
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  RPN:
    IN_FEATURES: ["vgg4"]
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
  PROPOSAL_GENERATOR:
    NAME: "RPN"
INPUT:
  MIN_SIZE_TRAIN: [600]
  MIN_SIZE_TEST: 600
#OUTPUT_DIR: /cluster/scratch/username/weights/adabn_weight2
#OUTPUT_DIR: /cluster/scratch/username/weights/source_prediction
OUTPUT_DIR: logs/test/hrrsd_hrsid/stage2/7499-rsnew/2499
DATASETS:
  TRAIN: ("hrsid_train",)
  TRAIN_TARGET: ("hrsid_train",)  # inductive setting
  TEST: ("hrsid_val",)  # inductive setting
SOLVER:
  STEPS: (60000, 80000, 90000, 360000)
  FACTOR_LIST: (1, 1, 1, 1, 1)
  MAX_ITER: 100000
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 2000
  IMS_PER_BATCH: 4
  BASE_LR: 0.0025
TEST:
  EVAL_PERIOD: 1000
  IMS_PER_BATCH: 4
VIS_PERIOD: 1000
VERSION: 2
SEED: 42
TRAINER: "base"
