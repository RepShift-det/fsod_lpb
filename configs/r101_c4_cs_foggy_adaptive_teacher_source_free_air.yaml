MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: save_dir/air/best.pth
  MASK_ON: False
  RESNETS:
    DEPTH: 101
    NORM: BN
  ROI_HEADS:
    NAME: "StandardROIHeads"
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 256
    # SCORE_THRESH_TEST: 45
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    FC_DIM: 2048
    POOLER_RESOLUTION: 7
  ANCHOR_GENERATOR:
    SIZES: [ [ 64, 128, 256, 512 ] ]
  RPN:
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
    BATCH_SIZE_PER_IMAGE: 256
  PROPOSAL_GENERATOR:
    NAME: "RPN"
INPUT:
  MIN_SIZE_TRAIN: [600]
  MIN_SIZE_TEST: 600
OUTPUT_DIR: logs/r_101_c4_cs_source/air/stage3
DATASETS:
  TRAIN: ("data_air_train",)
  TRAIN_TARGET: ("data_air_train",)
  TEST: ("data_air_val",)
SOLVER:
  STEPS: (60000, 80000, 90000)
  MAX_ITER: 8000
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 500
  IMS_PER_BATCH: 4
  BASE_LR: 0.0025
TEST:
  EVAL_PERIOD: 500
  IMS_PER_BATCH: 4
VIS_PERIOD: 5000
VERSION: 2
SEED: 42
TRAINER: "base_wq"
