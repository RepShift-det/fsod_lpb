MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  # WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  WEIGHTS: vgg16_bn.pkl
  MASK_ON: False
  BACKBONE:
    NAME: "build_vgg_backbone"
  ROI_HEADS:
    IN_FEATURES: ["vgg4"]
    NAME: "StandardROIHeads"
    NUM_CLASSES: 1
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  RPN:
    IN_FEATURES: ["vgg4"]
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
  PROPOSAL_GENERATOR:
    NAME: "RPN"
INPUT:
  MIN_SIZE_TRAIN: [600]
  MIN_SIZE_TEST: 600
OUTPUT_DIR: logs/hrrsd_ssdd/stage1/0.01-4
DATASETS:
  TRAIN: ("hrrsd_train",)
  # TRAIN_TARGET: ("cityscapes_instancesonly_foggy_train_foggy_beta_0.02",)  # inductive setting
  # TRAIN_TARGET: ("RDD2022_India_traintest",)  # transductive setting
  TEST: ("hrrsd_val",)  # inductive setting
  # TEST: ("RDD2022_Japan_test", "RDD2022_India_traintest")  # transductive setting
SOLVER:
  STEPS: (60000, 80000, 90000, 360000)
  FACTOR_LIST: (1, 1, 1, 1, 1)
  MAX_ITER: 10000
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 500
  IMS_PER_BATCH: 4
  BASE_LR: 0.01
TEST:
  EVAL_PERIOD: 500
  IMS_PER_BATCH: 4
VIS_PERIOD: 1000
VERSION: 2
SEED: 42
TRAINER: "base"