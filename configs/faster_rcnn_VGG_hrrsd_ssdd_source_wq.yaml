MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  # WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  #WEIGHTS: /cluster/scratch/username/simple-SFOD/vgg16_bn.pkl
  #WEIGHTS: /cluster/scratch/username/weights/model_0079999.pth
  # WEIGHTS: logs/hrrsd_hrsid/stage2/7499/model_0005999.pth
  # WEIGHTS: logs/hrrsd_hrsid/stage2/7499-rsnew/model_0002499.pth
  WEIGHTS: logs/hrrsd_ssdd/stage1/0.01-4/model_0007999.pth
  MASK_ON: False
  BACKBONE:
    NAME: "build_vgg_backbone"
  ROI_HEADS:
    IN_FEATURES: ["vgg4"]
    NAME: "StandardROIHeads"
    NUM_CLASSES: 1
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  RPN:
    IN_FEATURES: ["vgg4"]
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 1000
  PROPOSAL_GENERATOR:
    NAME: "RPN"
INPUT:
  MIN_SIZE_TRAIN: [600]
  MIN_SIZE_TEST: 600
OUTPUT_DIR: logs/hrrsd_hrsid/wq
# OUTPUT_DIR: logs/test/stage1/model_0060999
DATASETS:
  TRAIN: ("hrsid_train",)
  TRAIN_TARGET: ("hrsid_train",)  # inductive setting
  # TRAIN_TARGET: ("RDD2022_India_traintest",)  # transductive setting
  TEST: ("hrsid_val",)  # inductive setting
  # TEST: ("RDD2022_Japan_test", "RDD2022_India_traintest")  # transductive setting
SOLVER:
  STEPS: (60000, 80000, 90000, 360000)
  FACTOR_LIST: (1, 1, 1, 1, 1)
  MAX_ITER: 20000
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 100
  IMS_PER_BATCH: 4
  BASE_LR: 0.0025
TEST:
  EVAL_PERIOD: 100
  IMS_PER_BATCH: 4
VIS_PERIOD: 1000
VERSION: 2
SEED: 42
TRAINER: "base_wq"
# TRAINER: "curriculum"
WEAK_STRONG_AUGMENT: True


# CUDA_VISIBLE_DEVICES=7 python test.py --num-gpus 1 --config-file configs/faster_rcnn_VGG_hrrsd_ssdd_source_wq.yaml --confidence-file logs/test/hrrsd_hrsid/stage2/7499-rsnew/2499/inference/coco_instances_results.json